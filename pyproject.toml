[project]
name = "ml-churn-prediction"
version = "0.1.0"
description = "Machine learning model for customer churn prediction"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.4.0",
    "scikit-learn>=1.8.0",
    "skops>=0.13.0",
    "torch>=2.11.0",
    "fastapi>=0.135.0",
    "uvicorn>=0.42.0",
    "mlflow>=3.10.0",
    "kagglehub>=1.0.0",
    "openpyxl>=3.1.0",
    "seaborn>=0.13.0",
    "imbalanced-learn>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "pytest>=7.4.0",
]

[project.urls]
Repository = "https://github.com/seu-usuario/ml-churn-prediction"