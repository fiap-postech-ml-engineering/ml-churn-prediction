[project]
name = "ml-churn-prediction"
version = "0.1.0"
description = "Machine learning model for customer churn prediction"
requires-python = "~=3.13.0"
license = {text = "MIT"}

dependencies = [
    "pandas==2.3.0",
    "numpy==2.4.4",
    "scikit-learn==1.8.0",
    "skops==0.13.0",
    "torch==2.11.0",
    "fastapi==0.135.0",
    "uvicorn==0.42.0",
    "mlflow==3.10.0",
    "kagglehub==1.0.0",
    "openpyxl==3.1.0",
    "seaborn==0.13.0",
    "imbalanced-learn==0.14.0",
    "ipykernel==6.29.0",
    "jupyter==1.0.0",
]

[project.urls]
Repository = "https://github.com/fiap-postech-ml-engineering/ml-churn-prediction"

[project.optional-dependencies]
dev = [
    "ruff==0.15.10",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "taskipy==1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 79 # PEP8 Definition
target-version = "py313"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # isort (import sorting)
    "N", # pep8-naming
    "W", # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=html:tests/htmlcov --cov-report=term-missing --strict-markers"
minversion = "7.0"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: testes unitários (padrão)",
    "integration: testes de integração entre componentes",
    "model: testes de modelo/treino de ML",
    "api: testes de endpoint FastAPI",
    "slow: testes mais lentos (execute com -m 'not slow')",
]

[tool.coverage.run]
source = ['src']
branch = true
omit = ['tests/*', '**/__init__.py', "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true

[tool.taskipy.tasks]
test         = "pytest tests/ -v"
test-cov     = "pytest tests/ -v --cov=src --cov-report=html --cov-report=term"
lint         = "ruff check src/ tests/"
lint-fix     = "ruff check src/ tests/ --fix"
format       = "ruff format src/ tests/"
format-check = "ruff format src/ tests/ --check"
check        = "task lint && task format-check && task test"
clean        = "rm -rf .pytest_cache .coverage htmlcov __pycache__ .ruff_cache"
